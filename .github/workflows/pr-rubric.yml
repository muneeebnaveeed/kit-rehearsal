# Posts the PR rubric (pnpm pr:rubric) as one comment on every pull request, updated in place: tests,
# How to test, screenshots, summary, size and root cause, each with a tip on how to earn it.
# Advice only: it never fails on a low score and is not a required check. See "Templates, classification
# and checks" in CLAUDE.md.
#
# Security: pull_request_target runs this workflow as it is on main, with a token that can comment, also for
# PRs from forks. It checks out main (the default for pull_request_target), never the PR's code, and only
# reads PR metadata through the API, so a PR cannot change what runs here.
# Owner: platform team.
name: PR rubric

on:
  pull_request_target:
    types: [opened, edited, synchronize, ready_for_review]

# A newer push or edit supersedes a running pass on the same PR.
concurrency:
  group: pr-rubric-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  rubric:
    name: PR rubric
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The script has no dependencies, so there is no install step. The PR number comes through an env
      # var and the title and body only through the API, so neither can run as a command.
      - name: Post the rubric
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: node tooling/workflow/pr-rubric.ts --number "$NUMBER" --comment
