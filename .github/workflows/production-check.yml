# After every merge into main: waits until production runs it and every game opens through the gateway
# (pnpm qa:smoke), then publishes a GitHub release with the merged PR's notes. A push that changed nothing
# any service deploys (docs, tests, tooling) has no deploy, so it is neither checked nor released. A red run here means
# production is not healthy: roll back first (rule 9 in CLAUDE.md). Needs the KIT_GATEWAY variable
# (KIT_SETUP.md). Owner: platform team.
name: Production check

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

# Only the newest commit matters: an older check would wait for a deploy a newer one replaced.
concurrency:
  group: production-check
  cancel-in-progress: true

jobs:
  check:
    name: production check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Wait for production, then open every game
        id: smoke
        env:
          KIT_GATEWAY: ${{ vars.KIT_GATEWAY }}
        run: node tooling/qa/smoke.ts --sha ${{ github.sha }} --since ${{ github.event.before }} --timeout 1200
      - name: Publish the release notes
        if: steps.smoke.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          notes=$(mktemp)
          if [ -n "$pr" ]; then gh pr view "$pr" --json body --jq .body > "$notes"; else echo "Released ${{ github.sha }}." > "$notes"; fi
          tag="release-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" --target "${{ github.sha }}" --title "Release $(date -u '+%Y-%m-%d %H:%M') UTC" --notes-file "$notes"
